name: Build ZonePractice-Pro

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Install Local PaperSpigot Dependency
        run: |
          mvn install:install-file \
            -Dfile=libs/PaperSpigot-1.8.8-R0.1-SNAPSHOT.jar \
            -DgroupId=org.github.paperspigot \
            -DartifactId=paperspigot-api \
            -Dversion=1.8.8-R0.1-SNAPSHOT \
            -Dpackaging=jar \
            -DgeneratePom=true

      - name: Build with Maven
        run: mvn clean package

      - name: Upload Distribution JAR
        uses: actions/upload-artifact@v4
        with:
          name: ZonePractice-Pro-JAR
          path: distribution/target/*.jar
          retention-days: 90
